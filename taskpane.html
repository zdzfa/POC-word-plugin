<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Assistant Audit IA</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    
    <style>
        /* Style inspiré de Word 2016 pour l'intégration native */
        body { font-family: 'Segoe UI', sans-serif; padding: 10px; background-color: #f3f2f1; margin: 0; }
        .header { padding-bottom: 10px; border-bottom: 1px solid #ccc; margin-bottom: 15px; }
        h2 { color: #2b579a; margin: 0; font-size: 18px; }
        .sub-text { font-size: 12px; color: #666; margin-top: 5px; }

        /* Formulaire */
        label { font-size: 13px; font-weight: 600; color: #333; display: block; margin-bottom: 5px; }
        select { 
            width: 100%; padding: 8px; border: 1px solid #a6a6a6; 
            margin-bottom: 15px; font-family: 'Segoe UI'; font-size: 13px;
        }
        
        /* Bouton Principal */
        .ms-Button {
            background-color: #2b579a; color: white; border: none; padding: 12px;
            cursor: pointer; font-size: 14px; font-weight: 600; width: 100%;
            transition: background 0.2s;
        }
        .ms-Button:hover { background-color: #1e3f72; }
        .ms-Button:disabled { background-color: #ccc; cursor: default; }

        /* Zone de description du prompt (pour validation user) */
        .prompt-desc {
            background: #e1dfdd; padding: 10px; font-size: 12px; 
            border-left: 3px solid #2b579a; margin-bottom: 15px; color: #333;
            display: none; /* Caché par défaut */
        }

        /* Zone de résultat */
        #result-area { margin-top: 20px; display: none; background: white; padding: 10px; border: 1px solid #ddd; }
        .loading { color: #0078d4; font-weight: bold; text-align: center; padding: 20px; }
        .success-msg { color: green; font-weight: bold; margin-bottom: 10px; }
        .api-note { font-size: 11px; color: #999; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 5px;}
    </style>
</head>
<body>

<div class="header">
    <h2>Audit Toolkit IA</h2>
    <div class="sub-text">Sélectionnez un assistant pour traiter le texte.</div>
</div>

<label for="usecase-select">Quelle tâche souhaitez-vous effectuer ?</label>
<select id="usecase-select" onchange="updateDescription()">
    <option value="" disabled selected>-- Choisir un assistant --</option>
    
    <optgroup label="1. Analyse & Risques">
        <option value="case1">Préparation d'entretien (Analyse Risques)</option>
        <option value="case10">Analyse de Conformité Contrats</option>
        <option value="case11">Analyse d'Écarts Procédures (Gap Analysis)</option>
        <option value="case12">Note de Cadrage (Mission)</option>
    </optgroup>

    <optgroup label="2. Rédaction & Synthèse">
        <option value="case2">CR d'Entretien (Structuration)</option>
        <option value="case15">Draft depuis Fiche de Contrôle</option>
        <option value="case5">Synthèse des Recommandations</option>
        <option value="case27">Vérification Cohérence Synthèse/Rapport</option>
    </optgroup>

    <optgroup label="3. Revue & Qualité">
        <option value="case7">Relecture "Sparring Partner" (CEO)</option>
        <option value="case8">Relecture Forme & Orthographe</option>
        <option value="case3">Homogénéisation de Rapport</option>
        <option value="case22">Revue Qualité Fiches de Test</option>
    </optgroup>

    <optgroup label="4. Outils Spécifiques">
        <option value="case9">Anonymisation RGPD</option>
        <option value="case4">Extraction Acronymes</option>
        <option value="case26">Génération Questions Complémentaires</option>
    </optgroup>
</select>

<div id="prompt-desc" class="prompt-desc"></div>

<button id="run-btn" class="ms-Button">Lancer l'IA</button>

<div id="result-area"></div>

<script>
    // --- 1. BIBLIOTHEQUE DES PROMPTS (Simplifiée pour la démo) ---
    // Ces textes correspondent aux rôles définis dans votre document Word
    var promptsLibrary = {
        "case1": "Rôle : Auditeur interne. Mission : Analyser le document pour identifier les risques, zones de flou et préparer les questions d'entretien.",
        "case2": "Rôle : Consultant Audit. Mission : Transformer des notes brutes en compte rendu professionnel structuré (Points positifs / À améliorer / Détail).",
        "case3": "Rôle : Expert Qualité. Mission : Harmoniser le terminologie, le ton et la forme d'un rapport rédigé par plusieurs personnes.",
        "case4": "Rôle : Assistant Documentaire. Mission : Extraire tous les acronymes et générer le tableau de glossaire.",
        "case5": "Rôle : Assistant Auditeur. Mission : Extraire toutes les recommandations et créer le tableau de suivi plan d'action.",
        "case7": "Rôle : CEO (Simulé). Mission : Challenger le rapport sur le fond, la logique et la clarté pour un non-expert.",
        "case8": "Rôle : Éditeur Pro. Mission : Correction orthographique et reformulation du style sans altérer le fond.",
        "case9": "Rôle : DPO / Expert RGPD. Mission : Anonymiser le document (Noms, Lieux, Dates) en gardant la structure.",
        "case10": "Rôle : Juriste Bancaire. Mission : Vérifier les clauses obligatoires et identifier les clauses à risque dans le contrat.",
        "case11": "Rôle : Expert GRC. Mission : Comparer la procédure interne avec le texte réglementaire (Gap Analysis).",
        "case12": "Rôle : Auditeur Senior. Mission : Rédiger une note de cadrage (Risques majeurs, Réglementation, Approche) à partir du sujet.",
        "case15": "Rôle : Auditeur Senior. Mission : Rédiger un paragraphe narratif de rapport à partir d'une fiche de contrôle technique.",
        "case22": "Rôle : Superviseur Audit. Mission : Vérifier la qualité et les preuves des fiches de tests.",
        "case26": "Rôle : Enquêteur. Mission : Identifier les zones d'ombre d'un entretien et proposer des questions complémentaires.",
        "case27": "Rôle : Superviseur. Mission : Vérifier que la synthèse est fidèle au rapport complet (Exhaustivité, Ton, Risques)."
    };

    Office.onReady(function (info) {
        if (info.host === Office.HostType.Word) {
            document.getElementById("run-btn").onclick = runAnalysis;
        }
    });

    // Fonction pour mettre à jour la description quand on change le menu
    function updateDescription() {
        var select = document.getElementById("usecase-select");
        var descBox = document.getElementById("prompt-desc");
        var selectedValue = select.value;

        if (promptsLibrary[selectedValue]) {
            descBox.style.display = "block";
            descBox.innerHTML = "<strong>Prompt Système activé :</strong><br/>" + promptsLibrary[selectedValue];
        } else {
            descBox.style.display = "none";
        }
    }

    function runAnalysis() {
        var select = document.getElementById("usecase-select");
        var selectedValue = select.value;
        var resultArea = document.getElementById("result-area");
        
        // Validation simple
        if (!selectedValue) {
            resultArea.style.display = "block";
            resultArea.innerHTML = "<p style='color:red'>Veuillez sélectionner un type d'assistant dans la liste.</p>";
            return;
        }

        // UI Loading
        resultArea.style.display = "block";
        resultArea.innerHTML = '<p class="loading">⏳ Envoi au modèle IA sécurisé...</p>';

        Word.run(function (context) {
            var selection = context.document.getSelection();
            selection.load("text");

            return context.sync()
                .then(function () {
                    if (selection.text.trim() === "") {
                        resultArea.innerHTML = "<p style='color:orange'>⚠️ Veuillez sélectionner le texte à analyser dans le document.</p>";
                        return;
                    }

                    // SIMULATION APPEL API
                    // Dans la vraie version, on enverrait : { text: selection.text, promptId: selectedValue }
                    setTimeout(function() {
                        showMockResult(selectedValue, selection.text.length);
                    }, 1500);
                });
        }).catch(function (error) {
            console.log("Error: " + error);
        });
    }

    function showMockResult(caseId, textLength) {
        var resultArea = document.getElementById("result-area");
        var caseName = document.querySelector('#usecase-select option[value="'+caseId+'"]').text;
        
        var html = "<div class='success-msg'>✅ Analyse terminée</div>";
        html += "<p><strong>Assistant utilisé :</strong> " + caseName + "</p>";
        html += "<p>Le texte sélectionné (" + textLength + " caractères) a été traité.</p>";
        
        // Simulation de résultat spécifique selon le cas (Démonstration)
        html += "<div style='background:#f0f0f0; padding:10px; font-size:12px; border:1px solid #ccc;'>";
        
        if(caseId === 'case4') { // Acronymes
            html += "<strong>Tableau détecté (Extrait) :</strong><br/>";
            html += "- RGPD : Règlement Général sur la Protection des Données<br/>";
            html += "- DSI : Direction des Systèmes d'Information<br/>";
            html += "<em>... (Voir suite dans le document généré)</em>";
        } 
        else if (caseId === 'case9') { // Anonymisation
            html += "<strong>Aperçu Anonymisation :</strong><br/>";
            html += "Les occurrences de 'Monsieur Dupont' ont été remplacées par '[Personne A]'.<br/>";
            html += "Les dates ont été masquées.";
        }
        else { // Générique
            html += "<strong>Réponse de l'IA :</strong><br/>";
            html += "L'analyse a identifié 3 points d'attention majeurs dans le texte soumis. Veuillez consulter les commentaires insérés ou le rapport ci-dessous...";
        }
        
        html += "</div>";
        html += "<p class='api-note'>Ceci est une simulation. En production, ce bouton connectera Word à l'API interne de l'entreprise avec le prompt : <em>" + promptsLibrary[caseId].substring(0, 50) + "...</em></p>";

        resultArea.innerHTML = html;
    }
</script>

</body>
</html>

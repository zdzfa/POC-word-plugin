<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant IA</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        /* ============================================
           DESIGN SYSTEM — Fluent Enterprise
           ============================================ */
        :root {
            --blue:       #0F6CBD;
            --blue-dark:  #0A4D8C;
            --blue-light: #E8F1FA;
            --blue-bg:    #F0F6FC;
            --accent:     #0E7A5B;
            --accent-light:#E6F5F0;
            --bg:         #F5F5F5;
            --surface:    #FFFFFF;
            --surface-hover:#F0F4F8;
            --text:       #1B1B1B;
            --text-sec:   #5C5C5C;
            --text-muted: #999;
            --border:     #E1E1E1;
            --border-lt:  #EFEFEF;
            --success:    #107C10;
            --success-bg: #DFF6DD;
            --warn:       #D48C00;
            --warn-bg:    #FFF4CE;
            --error:      #C4314B;
            --error-bg:   #FDE7E9;
            --r:          8px;
            --r-lg:       12px;
            --sh:         0 1px 4px rgba(0,0,0,.07);
            --sh-lg:      0 4px 16px rgba(0,0,0,.10);
            --tr:         .18s ease;
            --font:       'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; height:100vh; overflow:hidden; }

        /* ---- App Shell ---- */
        .app { display:flex; flex-direction:column; height:100vh; }

        /* ---- Header ---- */
        .header {
            background: linear-gradient(135deg, #0F6CBD 0%, #0A4D8C 60%, #073B6B 100%);
            color: #fff;
            padding: 12px 16px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 90px; height: 90px;
            border-radius: 50%;
            background: rgba(255,255,255,.06);
        }
        .header-row { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
        .header-icon {
            width:32px; height:32px; border-radius:8px;
            background:rgba(255,255,255,.15);
            display:flex; align-items:center; justify-content:center;
            font-size:18px; flex-shrink:0;
        }
        .header-title { font-size:15px; font-weight:700; letter-spacing:.2px; }
        .header-sub { font-size:10.5px; opacity:.75; margin-top:1px; }

        /* ---- Tabs ---- */
        .tabs {
            display:flex; background:var(--surface);
            border-bottom:1px solid var(--border);
            flex-shrink:0; position:relative; z-index:2;
        }
        .tab-btn {
            flex:1; padding:10px 8px; text-align:center;
            font-family:var(--font); font-size:12.5px; font-weight:600;
            background:none; border:none; border-bottom:2.5px solid transparent;
            color:var(--text-sec); cursor:pointer;
            transition: all var(--tr);
        }
        .tab-btn:hover { color:var(--text); background:var(--blue-bg); }
        .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }

        /* ---- Main scrollable ---- */
        .main-content { flex:1; overflow-y:auto; overflow-x:hidden; }

        /* ---- Tab panels ---- */
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        /* ---- Tools Grid ---- */
        .tools-section { padding:10px 14px 4px; }
        .section-label {
            font-size:10.5px; font-weight:700; text-transform:uppercase;
            letter-spacing:.8px; color:var(--text-muted); margin-bottom:8px;
        }
        .tools-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }

        .tool-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--r); padding:10px 10px 8px; cursor:pointer;
            transition:all var(--tr); display:flex; flex-direction:column; gap:3px;
            position:relative; overflow:hidden;
        }
        .tool-card::before {
            content:''; position:absolute; top:0; left:0;
            width:3px; height:100%; border-radius:0 2px 2px 0;
            background:var(--card-accent, var(--blue));
            opacity:0; transition:opacity var(--tr);
        }
        .tool-card:hover { border-color:var(--blue); background:var(--surface-hover); transform:translateY(-1px); box-shadow:var(--sh); }
        .tool-card:hover::before { opacity:1; }
        .tool-card .tc-icon { font-size:18px; margin-bottom:2px; }
        .tool-card .tc-name { font-size:11.5px; font-weight:600; color:var(--text); line-height:1.25; }
        .tool-card .tc-desc { font-size:10px; color:var(--text-muted); line-height:1.3; }

        /* Full-width tool card */
        .tool-card.full { grid-column: 1 / -1; flex-direction:row; align-items:center; gap:10px; padding:10px 12px; }
        .tool-card.full .tc-icon { font-size:20px; margin-bottom:0; }
        .tool-card.full .tc-text { flex:1; }

        /* ---- Assistants Grid ---- */
        .assistants-section { padding:10px 14px; }
        .assistants-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
        .assistant-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--r); padding:10px; cursor:pointer;
            transition:all var(--tr); display:flex; flex-direction:column; gap:4px;
        }
        .assistant-card:hover { border-color:var(--blue); background:var(--surface-hover); transform:translateY(-1px); box-shadow:var(--sh); }
        .assistant-card .ac-icon {
            width:34px; height:34px; border-radius:var(--r);
            display:flex; align-items:center; justify-content:center;
            font-size:18px; flex-shrink:0;
        }
        .assistant-card .ac-name { font-size:11.5px; font-weight:600; color:var(--text); line-height:1.25; }
        .assistant-card .ac-desc { font-size:10px; color:var(--text-muted); line-height:1.3; }

        .empty-assistants {
            text-align:center; padding:24px 12px; color:var(--text-muted);
            font-size:12px; font-style:italic;
        }

        /* ---- Chat View ---- */
        .view-chat { display:none; flex-direction:column; height:100%; }
        .view-chat.active { display:flex; }

        .chat-header {
            display:flex; align-items:center; gap:8px;
            padding:8px 12px; border-bottom:1px solid var(--border-lt);
            background:var(--surface); flex-shrink:0;
        }
        .chat-back {
            background:none; border:none; cursor:pointer; padding:5px;
            border-radius:4px; color:var(--text-sec); font-size:18px;
            display:flex; align-items:center; transition:background var(--tr);
        }
        .chat-back:hover { background:var(--border-lt); }
        .chat-info { flex:1; min-width:0; }
        .chat-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
        .chat-desc { font-size:10.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-actions-top { display:flex; gap:4px; }
        .chat-top-btn {
            background:none; border:1px solid var(--border); border-radius:6px;
            padding:4px 8px; font-size:10.5px; color:var(--text-sec);
            cursor:pointer; font-family:var(--font); white-space:nowrap;
            transition:all var(--tr);
        }
        .chat-top-btn:hover { background:var(--border-lt); border-color:var(--text-muted); }

        /* Messages */
        .chat-messages {
            flex:1; overflow-y:auto; padding:10px 12px;
            display:flex; flex-direction:column; gap:10px;
        }
        .message { max-width:95%; animation:slideUp .22s ease; }
        @keyframes slideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        .msg-user { align-self:flex-end; }
        .msg-user .bubble {
            background:var(--blue); color:#fff;
            border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);
            padding:10px 12px; font-size:12px;
        }
        .msg-user .bubble .msg-label { font-size:9.5px; opacity:.75; margin-bottom:3px; font-weight:600; }
        .msg-user .bubble .msg-sel-preview {
            background:rgba(255,255,255,.12); padding:5px 8px;
            border-radius:6px; font-size:11px; margin:3px 0;
            max-height:60px; overflow:hidden; line-height:1.35;
        }
        .msg-user .bubble .msg-instr { margin-top:5px; font-style:italic; opacity:.85; font-size:11.5px; }

        .msg-ai { align-self:flex-start; }
        .msg-ai .bubble {
            background:var(--surface); border:1px solid var(--border);
            border-radius:4px var(--r-lg) var(--r-lg) var(--r-lg);
            padding:12px; font-size:12px;
        }

        /* AI result formatting */
        .result-content { line-height:1.6; }
        .result-content h3 { font-size:12.5px; margin:8px 0 4px; color:var(--blue-dark); }
        .result-content h3:first-child { margin-top:0; }
        .result-content p { margin:3px 0; }
        .result-content ul,.result-content ol { padding-left:16px; margin:3px 0; }
        .result-content li { margin:2px 0; }
        .result-content table { width:100%; border-collapse:collapse; margin:6px 0; font-size:11px; }
        .result-content table th { background:var(--blue-light); color:var(--blue-dark); font-weight:600; text-align:left; padding:5px 7px; border:1px solid var(--border); }
        .result-content table td { padding:4px 7px; border:1px solid var(--border); }
        .result-content table tr:nth-child(even) td { background:#FAFBFC; }

        .diff-del { background:#FECDD3; color:#9F1239; text-decoration:line-through; padding:1px 3px; border-radius:3px; }
        .diff-ins { background:#BBF7D0; color:#166534; padding:1px 3px; border-radius:3px; font-weight:500; }

        .section-block { border:1px solid var(--border); border-radius:var(--r); margin:6px 0; overflow:hidden; }
        .section-header { display:flex; align-items:center; justify-content:space-between; padding:7px 10px; background:#F8F9FA; cursor:pointer; font-weight:600; font-size:11.5px; gap:6px; }
        .section-header:hover { background:#F0F1F3; }
        .section-header .badge { font-size:9.5px; padding:2px 7px; border-radius:10px; font-weight:600; color:#fff; }
        .badge-critical { background:var(--error); }
        .badge-major { background:#E97025; }
        .badge-moderate { background:var(--warn); color:#333; }
        .badge-minor { background:var(--blue); }
        .badge-ok { background:var(--success); }
        .section-body { padding:7px 10px; font-size:11.5px; border-top:1px solid var(--border); }

        .exec-summary { background:var(--blue-bg); border:1px solid #C5D9ED; border-radius:var(--r); padding:10px 12px; margin-bottom:8px; }
        .exec-summary-title { font-weight:700; font-size:12px; color:var(--blue-dark); margin-bottom:3px; }

        .report-meta { background:#F5F6F7; border-radius:var(--r); padding:8px 10px; margin-bottom:8px; font-size:11px; }
        .report-meta-row { display:flex; gap:6px; padding:1.5px 0; }
        .report-meta-label { font-weight:600; color:var(--text-sec); min-width:70px; }

        .annotation-block { border-left:3px solid var(--blue); background:var(--blue-bg); padding:7px 10px; margin:5px 0; border-radius:0 var(--r) var(--r) 0; font-size:11.5px; }
        .annotation-block.improved { border-left-color:var(--success); background:var(--success-bg); }
        .annotation-label { font-weight:600; font-size:10.5px; text-transform:uppercase; margin-bottom:2px; }

        .score-display { display:inline-flex; align-items:center; gap:6px; font-size:20px; font-weight:700; color:var(--blue); margin:4px 0; }
        .score-display .score-label { font-size:11.5px; font-weight:400; color:var(--text-sec); }

        /* Message action bar */
        .msg-actions {
            display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;
            padding-top:7px; border-top:1px solid var(--border-lt);
        }
        .ma-btn {
            background:var(--bg); border:1px solid var(--border); border-radius:6px;
            padding:3px 9px; font-size:10.5px; font-family:var(--font); cursor:pointer;
            color:var(--text-sec); display:flex; align-items:center; gap:3px;
            transition:all var(--tr);
        }
        .ma-btn:hover { background:var(--blue-light); border-color:var(--blue); color:var(--blue-dark); }

        /* Loading dots */
        .loading-wrap { display:flex; align-items:center; gap:8px; padding:10px 12px; color:var(--text-muted); font-size:11.5px; }
        .dots { display:flex; gap:4px; }
        .dots span { width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 1.4s infinite ease-in-out; }
        .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
        @keyframes pulse { 0%,80%,100%{opacity:.25;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

        /* ---- Input Area ---- */
        .input-area {
            border-top:1px solid var(--border); background:var(--surface);
            padding:8px 12px 10px; flex-shrink:0; display:none;
        }
        .input-area.active { display:block; }

        .sel-preview {
            background:var(--bg); border:1px solid var(--border-lt);
            border-radius:var(--r); padding:7px 10px; margin-bottom:7px; font-size:11px;
        }
        .sel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
        .sel-label { font-weight:600; color:var(--text-sec); display:flex; align-items:center; gap:4px; }
        .sel-stats { color:var(--text-muted); font-size:9.5px; }
        .sel-text { color:var(--text); line-height:1.35; max-height:44px; overflow:hidden; position:relative; font-size:11px; }
        .sel-text::after { content:''; position:absolute; bottom:0; left:0; right:0; height:18px; background:linear-gradient(transparent,var(--bg)); }
        .sel-empty { color:var(--text-muted); font-style:italic; }

        .sel-toolbar { display:flex; gap:4px; margin-bottom:7px; }
        .sel-tb-btn {
            background:var(--blue-bg); border:1px solid #C5D9ED; border-radius:6px;
            padding:4px 10px; font-size:10.5px; font-family:var(--font);
            color:var(--blue); cursor:pointer; font-weight:500;
            display:flex; align-items:center; gap:4px;
            transition:all var(--tr);
        }
        .sel-tb-btn:hover { background:var(--blue-light); border-color:var(--blue); }

        /* Language selector (for translate) */
        .lang-row { display:flex; gap:6px; margin-bottom:7px; align-items:center; }
        .lang-row select {
            flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:var(--r);
            font-family:var(--font); font-size:12px; color:var(--text); background:var(--surface);
        }
        .lang-row select:focus { outline:none; border-color:var(--blue); }
        .lang-row label { font-size:11px; font-weight:600; color:var(--text-sec); white-space:nowrap; }

        /* Tone selector (for reformulate) */
        .tone-chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:7px; }
        .tone-chip {
            padding:4px 10px; border:1px solid var(--border); border-radius:16px;
            font-size:10.5px; font-family:var(--font); cursor:pointer;
            color:var(--text-sec); background:var(--surface);
            transition:all var(--tr);
        }
        .tone-chip:hover { border-color:var(--blue); color:var(--blue); }
        .tone-chip.active { background:var(--blue); color:#fff; border-color:var(--blue); }

        .input-row { display:flex; gap:6px; align-items:flex-end; }
        .input-wrap { flex:1; position:relative; }
        .input-wrap textarea {
            width:100%; border:1px solid var(--border); border-radius:var(--r);
            padding:7px 10px; font-family:var(--font); font-size:12px;
            resize:none; line-height:1.4; min-height:34px; max-height:80px;
            color:var(--text); transition:border-color var(--tr);
        }
        .input-wrap textarea::placeholder { color:var(--text-muted); }
        .input-wrap textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 2px rgba(15,108,189,.1); }
        .send-btn {
            width:34px; height:34px; border-radius:var(--r); border:none;
            background:var(--blue); color:#fff; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; transition:background var(--tr);
        }
        .send-btn:hover { background:var(--blue-dark); }
        .send-btn:disabled { background:var(--border); cursor:default; }
        .send-btn svg { width:16px; height:16px; fill:currentColor; }

        /* ---- Toast ---- */
        .toast-box { position:fixed; top:10px; left:10px; right:10px; z-index:1000; pointer-events:none; }
        .toast {
            background:#333; color:#fff; padding:7px 12px; border-radius:var(--r);
            font-size:11.5px; margin-bottom:5px; pointer-events:auto;
            animation:tIn .22s ease, tOut .3s ease 2.5s forwards; box-shadow:var(--sh-lg);
        }
        .toast-success { background:var(--success); }
        .toast-error { background:var(--error); }
        @keyframes tIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        @keyframes tOut { from{opacity:1} to{opacity:0;transform:translateY(-8px)} }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#CCC; border-radius:4px; }
        ::-webkit-scrollbar-thumb:hover { background:#AAA; }

        .hidden { display:none !important; }

        /* ---- Options dropdown inline ---- */
        .options-bar { display:flex; gap:4px; margin-bottom:7px; flex-wrap:wrap; }
        .opt-chip {
            padding:4px 10px; border:1px solid var(--border); border-radius:16px;
            font-size:10.5px; font-family:var(--font); cursor:pointer;
            color:var(--text-sec); background:var(--surface); transition:all var(--tr);
        }
        .opt-chip:hover { border-color:var(--blue); color:var(--blue); }
        .opt-chip.active { background:var(--blue); color:#fff; border-color:var(--blue); }
    </style>
</head>
<body>

<div class="app">
    <!-- ======== HEADER ======== -->
    <div class="header">
        <div class="header-row">
            <div class="header-icon">&#9889;</div>
            <div>
                <div class="header-title">Assistant IA</div>
                <div class="header-sub">Outils IA &amp; Assistants m&eacute;tiers</div>
            </div>
        </div>
    </div>

    <!-- ======== TABS ======== -->
    <div class="tabs" id="tabBar">
        <button class="tab-btn active" data-tab="tools">&#9874;&#65039; Outils</button>
        <button class="tab-btn" data-tab="assistants">&#129302; Assistants</button>
    </div>

    <!-- ======== MAIN CONTENT ======== -->
    <div class="main-content" id="mainContent">

        <!-- ──── TOOLS TAB ──── -->
        <div id="panelTools" class="tab-panel active">

            <div class="tools-section">
                <div class="section-label">R&eacute;daction &amp; Langue</div>
                <div class="tools-grid" id="gridRedaction"></div>
            </div>

            <div class="tools-section">
                <div class="section-label">Analyse &amp; Extraction</div>
                <div class="tools-grid" id="gridAnalyse"></div>
            </div>

            <div class="tools-section">
                <div class="section-label">Mise en forme</div>
                <div class="tools-grid" id="gridForme"></div>
            </div>

            <div class="tools-section">
                <div class="section-label">G&eacute;n&eacute;ration</div>
                <div class="tools-grid" id="gridGeneration"></div>
            </div>

        </div>

        <!-- ──── ASSISTANTS TAB ──── -->
        <div id="panelAssistants" class="tab-panel">
            <div class="assistants-section" id="assistantsContainer"></div>
        </div>

        <!-- ──── CHAT VIEW ──── -->
        <div id="viewChat" class="view-chat">
            <div class="chat-header">
                <button class="chat-back" id="btnBack" title="Retour">&#8592;</button>
                <div class="chat-info">
                    <div class="chat-name" id="chatName"></div>
                    <div class="chat-desc" id="chatDesc"></div>
                </div>
                <div class="chat-actions-top">
                    <button class="chat-top-btn" id="btnClear">Nouveau</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>

    <!-- ======== INPUT AREA ======== -->
    <div id="inputArea" class="input-area">
        <!-- Selection preview -->
        <div class="sel-preview" id="selPreview">
            <div class="sel-header">
                <span class="sel-label">&#128196; Texte s&eacute;lectionn&eacute;</span>
                <span class="sel-stats" id="selStats"></span>
            </div>
            <div id="selContent" class="sel-empty">S&eacute;lectionnez du texte dans Word...</div>
        </div>

        <!-- Toolbar: select all, select paragraph -->
        <div class="sel-toolbar" id="selToolbar">
            <button class="sel-tb-btn" onclick="WordAPI.selectAll()" title="S&eacute;lectionner tout le document">&#128462; Tout s&eacute;lectionner</button>
            <button class="sel-tb-btn" onclick="WordAPI.selectCurrentParagraph()" title="S&eacute;lectionner le paragraphe actuel">&#182; Paragraphe</button>
        </div>

        <!-- Dynamic options (language, tone, etc.) -->
        <div id="dynamicOptions"></div>

        <!-- Text input -->
        <div class="input-row">
            <div class="input-wrap">
                <textarea id="inputText" placeholder="Instructions suppl&eacute;mentaires (optionnel)..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="btnSend" title="Envoyer" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-box" id="toastBox"></div>

<script>
/* =============================================================
   ASSISTANT IA — Configuration & Données
   =============================================================
   POUR AJOUTER UN OUTIL OU ASSISTANT :
   1. Ajoutez-le dans TOOLS ou ASSISTANT_GROUPS ci-dessous
   2. Ajoutez son prompt dans PROMPTS
   3. C'est tout ! L'interface se met à jour automatiquement.
   ============================================================= */

// ── CONFIGURATION API ──────────────────────────────────────
var CONFIG = {
    // Passer à false pour utiliser l'API réelle
    useMock: true,

    // === PARAMÈTRES API (à remplir par l'équipe IT) ===

// ── WORD API ───────────────────────────────────────────────
var WordAPI = {
    getSelectedText: function() {
        return Word.run(function(ctx) {
            var sel = ctx.document.getSelection();
            sel.load('text');
            return ctx.sync().then(function() { return sel.text; });
        }).catch(function() { return ''; });
    },

    selectAll: function() {
        Word.run(function(ctx) {
            var body = ctx.document.body;
            body.load('text');
            return ctx.sync().then(function() {
                var range = body.getRange();
                range.select();
                return ctx.sync();
            });
        }).then(function() {
            UI.showToast('Document entier s\u00e9lectionn\u00e9', 'success');
            // Force immediate poll
            WordAPI.pollSelection();
        }).catch(function() {
            UI.showToast('Erreur de s\u00e9lection', 'error');
        });
    },

    selectCurrentParagraph: function() {
        Word.run(function(ctx) {
            var sel = ctx.document.getSelection();
            var paragraphs = sel.paragraphs;
            paragraphs.load('text');
            return ctx.sync().then(function() {
                if (paragraphs.items.length > 0) {
                    var range = paragraphs.items[0].getRange();
                    range.select();
                    return ctx.sync();
                }
            });
        }).then(function() {
            UI.showToast('Paragraphe s\u00e9lectionn\u00e9', 'success');
            WordAPI.pollSelection();
        }).catch(function() {
            UI.showToast('Erreur de s\u00e9lection', 'error');
        });
    },

    insertAfterSelection: function(html) {
        return Word.run(function(ctx) {
            var sel = ctx.document.getSelection();
            var plainText = UI.stripHtml(html);
            sel.insertText('\n\n' + plainText, Word.InsertLocation.after);
            return ctx.sync();
        });
    },

    replaceSelection: function(text) {
        return Word.run(function(ctx) {
            var sel = ctx.document.getSelection();
            sel.insertText(text, Word.InsertLocation.replace);
            return ctx.sync();
        });
    },

    pollSelection: function() {
        WordAPI.getSelectedText().then(function(text) {
            if (text !== AppState.selectedText) {
                AppState.selectedText = text;
                UI.updateSelectionPreview();
                UI.updateSendButton();
            }
        });
    },

    startPolling: function() {
        WordAPI.stopPolling();
        WordAPI.pollSelection();
        AppState.pollingTimer = setInterval(function() { WordAPI.pollSelection(); }, CONFIG.selectionPollInterval);
    },

    stopPolling: function() {
        if (AppState.pollingTimer) {
            clearInterval(AppState.pollingTimer);
            AppState.pollingTimer = null;
        }
    }
};

// ── API MODULE ─────────────────────────────────────────────
var API = {
    call: function(itemId, userText, instructions) {
        if (CONFIG.useMock) return API.mockCall(itemId);
        return API.realCall(itemId, userText, instructions);
    },

    mockCall: function(itemId) {
        return new Promise(function(resolve) {
            setTimeout(function() {
                resolve({
                    html: MOCK_RESPONSES[itemId] || '<p>R\u00e9ponse de l\u2019assistant <strong>' + itemId + '</strong>.</p>',
                    plain: ''
                });
            }, CONFIG.mockDelay);
        });
    },

    realCall: function(itemId, userText, instructions) {
        var systemPrompt = PROMPTS[itemId] || '';
        var userMessage = userText;

        // Inject dynamic values (language, tone, format)
        var dv = AppState.dynamicValues;
        if (dv.targetLang) {
            var langMap = {en:'anglais',de:'allemand',es:'espagnol',it:'italien',pt:'portugais',nl:'n\u00e9erlandais',zh:'chinois',ja:'japonais',ar:'arabe'};
            userMessage = 'Langue cible : ' + (langMap[dv.targetLang] || dv.targetLang) + '\n\n' + userMessage;
        }
        if (dv.tone) userMessage = 'Ton demand\u00e9 : ' + dv.tone + '\n\n' + userMessage;
        if (dv.format) userMessage = 'Format demand\u00e9 : ' + dv.format + '\n\n' + userMessage;
        if (dv.emailTone) userMessage = 'Ton de l\u2019email : ' + dv.emailTone + '\n\n' + userMessage;

        if (instructions) userMessage += '\n\n--- Instructions suppl\u00e9mentaires ---\n' + instructions;

        var headers = { 'Content-Type': 'application/json' };
        if (CONFIG.apiKey) headers['Authorization'] = 'Bearer ' + CONFIG.apiKey;

        return fetch(CONFIG.apiEndpoint, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
                model: CONFIG.model,
                max_tokens: CONFIG.maxTokens,
                temperature: CONFIG.temperature,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userMessage }
                ]
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var text = '';
            // Support OpenAI-compatible and Anthropic-compatible formats
            if (data.choices && data.choices[0] && data.choices[0].message) {
                text = data.choices[0].message.content;
            } else if (data.content && data.content[0]) {
                text = data.content[0].text;
            } else {
                text = 'Erreur : r\u00e9ponse inattendue.';
            }
            return { html: UI.markdownToHtml(text), plain: text };
        })
        .catch(function(err) {
            return { html: '<p style="color:var(--error)">Erreur de connexion au serveur IA : ' + UI.escapeHtml(err.message) + '</p>', plain: 'Erreur' };
        });
    }
};

var DialogManager = {
    open: function(data) {
        try {
            Office.context.ui.displayDialogAsync(
                CONFIG.dialogUrl,
                { width: 65, height: 70, displayInIframe: false },
                function(result) {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        var dialog = result.value;
                        dialog.addEventHandler(Office.EventType.DialogMessageReceived, function(arg) {
                            if (arg.message === 'ready') {
                                dialog.messageChild(JSON.stringify(data));
                            } else if (arg.message === 'close') {
                                dialog.close();
                            }
                        });
                        dialog.addEventHandler(Office.EventType.DialogEventReceived, function() {});
                    }
                }
            );
        } catch(e) {
            // Fallback: open in new window for web
            var win = window.open('', '_blank', 'width=800,height=600');
            if (win) {
                win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>R\u00e9sultat IA</title><style>body{font-family:Segoe UI,sans-serif;padding:24px;color:#1B1B1B;line-height:1.6;font-size:14px;max-width:800px;margin:0 auto}h3{color:#0A4D8C;margin-top:16px}table{width:100%;border-collapse:collapse;margin:12px 0}th{background:#E8F1FA;padding:8px;border:1px solid #E1E1E1;text-align:left}td{padding:8px;border:1px solid #E1E1E1}.diff-del{background:#FECDD3;color:#9F1239;text-decoration:line-through;padding:1px 4px;border-radius:3px}.diff-ins{background:#BBF7D0;color:#166534;padding:1px 4px;border-radius:3px}</style></head><body>' + data.resultHtml + '</body></html>');

        var btns = document.querySelectorAll('.tab-btn');

                var tab = this.getAttribute('data-tab');
                AppState.activeTab = tab;

                // Update tab buttons
                var all = document.querySelectorAll('.tab-btn');
                for (var j = 0; j < all.length; j++) all[j].classList.remove('active');
                this.classList.add('active');

                // Update panels
                document.getElementById('panelTools').classList.toggle('active', tab === 'tools');
                document.getElementById('panelAssistants').classList.toggle('active', tab === 'assistants');
            });
        }
    },

    renderToolsGrid: function() {
        var categories = { redaction: 'gridRedaction', analyse: 'gridAnalyse', forme: 'gridForme', generation: 'gridGeneration' };
        for (var cat in categories) {
            var container = document.getElementById(categories[cat]);

            container.innerHTML = '';
            var items = TOOLS.filter(function(t) { return t.category === cat; });

                container.appendChild(card);
            }
        }
    },

    showChatView: function(item) {
        document.getElementById('panelTools').classList.remove('active');
        document.getElementById('panelAssistants').classList.remove('active');
        document.getElementById('tabBar').classList.add('hidden');
        document.getElementById('viewChat').classList.add('active');
        document.getElementById('inputArea').classList.add('active');

        document.getElementById('chatName').innerHTML = (item.icon || '') + ' ' + UI.escapeHtml(item.name);
        document.getElementById('chatDesc').textContent = item.desc || item.description || '';

        UI.renderDynamicOptions();
        UI.renderMessages();
    },

    showGridView: function() {
        document.getElementById('viewChat').classList.remove('active');
        document.getElementById('inputArea').classList.remove('active');
        document.getElementById('tabBar').classList.remove('hidden');
        document.getElementById('dynamicOptions').innerHTML = '';

        // Re-show the correct tab
        document.getElementById('panelTools').classList.toggle('active', AppState.activeTab === 'tools');
        document.getElementById('panelAssistants').classList.toggle('active', AppState.activeTab === 'assistants');
    },

    renderDynamicOptions: function() {
        var container = document.getElementById('dynamicOptions');
        container.innerHTML = '';
        AppState.dynamicValues = {};

        var item = AppState.currentItem;
        if (!item || !item.options) return;

        var opts = item.options;

        if (opts.type === 'select') {
            var row = document.createElement('div');
            row.className = 'lang-row';
            row.innerHTML = '<label>' + UI.escapeHtml(opts.label || 'Option') + ' :</label>';
            var sel = document.createElement('select');
            for (var i = 0; i < opts.choices.length; i++) {
                var o = opts.choices[i];
                sel.innerHTML += '<option value="' + o.value + '">' + UI.escapeHtml(o.label) + '</option>';
            }
            AppState.dynamicValues[opts.key] = opts.choices[0].value;
            sel.onchange = function() { AppState.dynamicValues[opts.key] = this.value; };
            row.appendChild(sel);
            container.appendChild(row);
        }

        if (opts.type === 'chips') {
            var bar = document.createElement('div');
            bar.className = 'tone-chips';
            var defaultVal = opts.default || opts.choices[0].value;
            AppState.dynamicValues[opts.key] = defaultVal;

            for (var j = 0; j < opts.choices.length; j++) {
                var c = opts.choices[j];
                var chip = document.createElement('button');
                chip.className = 'tone-chip' + (c.value === defaultVal ? ' active' : '');
                chip.textContent = c.label;
                chip.setAttribute('data-val', c.value);
                chip.onclick = function() {
                    var siblings = this.parentNode.querySelectorAll('.tone-chip');
                    for (var k = 0; k < siblings.length; k++) siblings[k].classList.remove('active');
                    this.classList.add('active');
                    AppState.dynamicValues[opts.key] = this.getAttribute('data-val');
                };
                bar.appendChild(chip);
            }
            container.appendChild(bar);
        }
    },

    renderMessages: function() {
        var box = document.getElementById('chatMessages');
        box.innerHTML = '';

        if (AppState.messages.length === 0) {
            var empty = document.createElement('div');
            empty.style.cssText = 'text-align:center;padding:30px 16px;color:var(--text-muted)';
            empty.innerHTML = '<div style="font-size:28px;margin-bottom:8px">' + (AppState.currentItem ? AppState.currentItem.icon || '\u2728' : '\u2728') + '</div>'
                + '<div style="font-size:12.5px;font-weight:600;margin-bottom:4px">' + UI.escapeHtml(AppState.currentItem ? AppState.currentItem.name : '') + '</div>'
                + '<div style="font-size:11px">S\u00e9lectionnez du texte dans Word<br/>puis cliquez sur Envoyer</div>';
            box.appendChild(empty);
            return;
        }

        for (var i = 0; i < AppState.messages.length; i++) {
            var msg = AppState.messages[i];
            var div = document.createElement('div');

            if (msg.role === 'user') {
                div.className = 'message msg-user';
                var preview = msg.selection.length > 150 ? msg.selection.substring(0, 150) + '\u2026' : msg.selection;
                var html = '<div class="bubble"><div class="msg-label">TEXTE S\u00c9LECTIONN\u00c9 (' + msg.selection.length + ' car.)</div><div class="msg-sel-preview">' + UI.escapeHtml(preview) + '</div>';
                if (msg.instructions) html += '<div class="msg-instr">' + UI.escapeHtml(msg.instructions) + '</div>';
                html += '</div>';
                div.innerHTML = html;
            } else {
                div.className = 'message msg-ai';
                div.innerHTML = '<div class="bubble"><div class="result-content">' + msg.content + '</div>'
                    + '<div class="msg-actions">'
                    + '<button class="ma-btn" onclick="Handlers.doCopy()">&#128203; Copier</button>'
                    + '<button class="ma-btn" onclick="Handlers.doInsert()">&#8595; Ins\u00e9rer</button>'
                    + '<button class="ma-btn" onclick="Handlers.doReplace()">&#8634; Remplacer</button>'
                    + '<button class="ma-btn" onclick="Handlers.openInWindow()">&#128194; Ouvrir</button>'
                    + '<button class="ma-btn" onclick="Handlers.regenerate()">&#8635; Reg\u00e9n\u00e9rer</button>'
                    + '</div></div>';
            }
            box.appendChild(div);
        }
    },

    updateSelectionPreview: function() {
        var content = document.getElementById('selContent');
        var stats = document.getElementById('selStats');

        if (!AppState.selectedText || AppState.selectedText.trim() === '') {
            content.className = 'sel-empty';
            content.textContent = 'S\u00e9lectionnez du texte dans Word...';
            stats.textContent = '';
        } else {
            content.className = 'sel-text';
            content.textContent = AppState.selectedText;
            var words = AppState.selectedText.trim().split(/\s+/).length;
            stats.textContent = AppState.selectedText.length + ' car. \u00b7 ~' + words + ' mots';
        }
    },

    updateSendButton: function() {
        var btn = document.getElementById('btnSend');
        btn.disabled = !AppState.selectedText || AppState.selectedText.trim() === '' || AppState.isLoading;
    },

    showLoading: function() {
        var box = document.getElementById('chatMessages');
        var div = document.createElement('div');
        div.id = 'loadingMsg';
        div.className = 'loading-wrap';
        div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div> Analyse en cours\u2026';
        box.appendChild(div);
        UI.scrollToBottom();
    },

    hideLoading: function() {
        var el = document.getElementById('loadingMsg');
        if (el) el.remove();
    },

    scrollToBottom: function() {
        var box = document.getElementById('chatMessages');
        setTimeout(function() { box.scrollTop = box.scrollHeight; }, 80);
    },

    showToast: function(text, type) {
        var container = document.getElementById('toastBox');
        var toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' toast-' + type : '');
        toast.textContent = text;
        container.appendChild(toast);
        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3000);
    },

    escapeHtml: function(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },

    stripHtml: function(html) {
        var div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || '';
    },

    markdownToHtml: function(text) {
        var html = text
            .replace(/### (.*)/g, '<h3>$1</h3>')
            .replace(/## (.*)/g, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n- /g, '</li><li>')
            .replace(/\n\d+\. /g, '</li><li>');

        if (html.indexOf('<li>') > -1 && html.indexOf('<ul>') === -1) {
            html = '<ul><li>' + html + '</li></ul>';
        }
        return '<p>' + html + '</p>';
    }
};

// ── HANDLERS ───────────────────────────────────────────────
var Handlers = {
    selectTool: function(tool) {
        AppState.currentItem = tool;
        AppState.currentType = 'tool';
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        UI.showChatView(tool);
        WordAPI.startPolling();
    },

    selectAssistant: function(assistant) {
        AppState.currentItem = assistant;
        AppState.currentType = 'assistant';
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        UI.showChatView(assistant);
        WordAPI.startPolling();
    },

    goBack: function() {
        AppState.currentItem = null;
        AppState.currentType = '';
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        AppState.dynamicValues = {};
        WordAPI.stopPolling();
        UI.showGridView();
    },

    clearChat: function() {
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        UI.renderMessages();
        UI.showToast('Conversation effac\u00e9e');
    },

    submit: function() {
        if (!AppState.currentItem || !AppState.selectedText || AppState.selectedText.trim() === '') {
            UI.showToast('S\u00e9lectionnez du texte dans Word', 'error');
            return;
        }
        if (AppState.isLoading) return;

        var instructions = document.getElementById('inputText').value.trim();
        var text = AppState.selectedText;

        AppState.messages.push({ role: 'user', selection: text, instructions: instructions });
        AppState.isLoading = true;
        UI.renderMessages();
        UI.showLoading();
        UI.updateSendButton();
        document.getElementById('inputText').value = '';

        API.call(AppState.currentItem.id, text, instructions).then(function(result) {
            AppState.isLoading = false;
            UI.hideLoading();
            AppState.lastResponseHtml = result.html;
            AppState.lastResponsePlain = result.plain || UI.stripHtml(result.html);
            AppState.messages.push({ role: 'ai', content: result.html });
            UI.renderMessages();
            UI.scrollToBottom();
            UI.updateSendButton();
        });
    },

    doInsert: function() {
        if (!AppState.lastResponseHtml) { UI.showToast('Aucun r\u00e9sultat', 'error'); return; }
        WordAPI.insertAfterSelection(AppState.lastResponseHtml).then(function() {
            UI.showToast('Ins\u00e9r\u00e9 dans le document', 'success');
        }).catch(function() { UI.showToast('Erreur d\u2019insertion', 'error'); });
    },

    doReplace: function() {
        if (!AppState.lastResponsePlain) { UI.showToast('Aucun r\u00e9sultat', 'error'); return; }
        WordAPI.replaceSelection(AppState.lastResponsePlain).then(function() {
            UI.showToast('S\u00e9lection remplac\u00e9e', 'success');
        }).catch(function() { UI.showToast('Erreur de remplacement', 'error'); });
    },

    doCopy: function() {
        var text = AppState.lastResponsePlain || '';
        if (!text) { UI.showToast('Rien \u00e0 copier', 'error'); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                UI.showToast('Copi\u00e9', 'success');
            }).catch(function() { Handlers.fallbackCopy(text); });
        } else { Handlers.fallbackCopy(text); }
    },

    fallbackCopy: function(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); UI.showToast('Copi\u00e9', 'success'); }
        catch(e) { UI.showToast('Impossible de copier', 'error'); }
        document.body.removeChild(ta);
    },

    openInWindow: function() {
        if (!AppState.lastResponseHtml || !AppState.currentItem) return;
        DialogManager.open({
            assistantName: AppState.currentItem.name,
            assistantIcon: AppState.currentItem.icon,
            resultHtml: AppState.lastResponseHtml,
            sourceText: AppState.selectedText ? (AppState.selectedText.length > 500 ? AppState.selectedText.substring(0, 500) + '\u2026' : AppState.selectedText) : ''
        });
    },

    regenerate: function() {
        if (AppState.messages.length < 2) return;
        var lastUser = null;
        for (var i = AppState.messages.length - 1; i >= 0; i--) {
            if (AppState.messages[i].role === 'user') { lastUser = AppState.messages[i]; break; }
        }
        if (!lastUser) return;
        if (AppState.messages[AppState.messages.length - 1].role === 'ai') AppState.messages.pop();

        AppState.isLoading = true;
        UI.renderMessages(); UI.showLoading(); UI.updateSendButton();

        API.call(AppState.currentItem.id, lastUser.selection, lastUser.instructions).then(function(result) {
            AppState.isLoading = false;
            UI.hideLoading();
            AppState.lastResponseHtml = result.html;
            AppState.lastResponsePlain = result.plain || UI.stripHtml(result.html);
            AppState.messages.push({ role: 'ai', content: result.html });
            UI.renderMessages(); UI.scrollToBottom(); UI.updateSendButton();
        });
    }
};

// ── INITIALIZATION ─────────────────────────────────────────
Office.onReady(function(info) {
    if (info.host === Office.HostType.Word) {
        UI.init();

        document.getElementById('btnBack').onclick = Handlers.goBack;
        document.getElementById('btnClear').onclick = Handlers.clearChat;
        document.getElementById('btnSend').onclick = Handlers.submit;

        var inputText = document.getElementById('inputText');
        inputText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); Handlers.submit(); }
        });
        inputText.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });
    }
});
</script>
